apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.reactnativeota"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

react {
  root = file("../")
  libraryName = "RNOtaSpec"
  codegenJavaPackageName = "com.reactnativeota"
  reactNativeDir = file("${rootProject.projectDir}/../node_modules/react-native")
  codegenDir = file("${rootProject.projectDir}/../node_modules/@react-native/codegen")
}
